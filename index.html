<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SKYREALM</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f1d9c0;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,"Hiragino Sans",sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:14px;top:12px;color:#4a3a52;font-size:13px;line-height:1.5;text-shadow:0 1px 6px #fff8;pointer-events:none}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f1d9c0;color:#4a3a52;font-size:18px;transition:opacity .8s}
#stick,#jump{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));display:none;border-radius:50%;background:#fff6;border:2px solid #fffa}
#stick{left:28px;width:130px;height:130px}#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#4a3a52aa}
#jump{right:28px;width:92px;height:92px;place-items:center;color:#4a3a52;font-size:15px}
@media(pointer:coarse){#stick{display:block}#jump{display:grid}}
</style></head><body>
<div id="boot">読み込み中…</div>
<div id="hud"></div>
<div id="stick"><div id="knob"></div></div><div id="jump">ジャンプ<br>(長押しで滑空)</div>
<script type="module" src="/src/main.js"></script></body></html>
