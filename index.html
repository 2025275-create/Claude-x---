<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SKYREALM</title>
<style>
html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#f1d9c0;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,"Hiragino Sans",sans-serif}
canvas{position:fixed;z-index:0;left:0;top:0;display:block;width:100vw;height:100vh;height:100dvh}
#hud{z-index:10;position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));color:#4a3a52;font-size:13px;line-height:1.5;text-shadow:0 1px 6px #fff8;pointer-events:none}
#boot{z-index:20;position:fixed;inset:0;display:grid;place-items:center;background:#f1d9c0;color:#4a3a52;font-size:18px;transition:opacity .8s}
#stick,#jump{z-index:10;position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));display:none;border-radius:50%;background:#fff6;border:2px solid #fffa}
#stick{left:calc(28px + env(safe-area-inset-left));width:130px;height:130px}#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#4a3a52aa}
#jump{right:calc(28px + env(safe-area-inset-right));width:92px;height:92px;place-items:center;color:#4a3a52;font-size:13px;line-height:1.3;text-align:center}
@media(pointer:coarse){#stick{display:block}#jump{display:grid}}
</style></head><body>
<div id="boot">読み込み中…</div>
<div id="hud"></div>
<div id="stick"><div id="knob"></div></div><div id="jump">ジャンプ<br>(長押しで滑空)</div>
<script type="module" src="/main.js"></script></body></html>
